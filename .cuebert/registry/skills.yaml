# Cuebert Skill Registry
# Auto-scanned by Supervisor Step 0.6 for keyword matching.
# Updated by Code Agent when skills are created or modified.
#
# Only skills with tools/*.py files defining `def register(mcp: FastMCP) -> None:`
# are exposed as MCP tools. Non-MCP skills are not registered here.
#
# Expected skills (populated across M1-P6 and M4-M6):
#   - memory-toolkit       (M1-P6)  core group
#   - comfyui-toolkit      (M4-P1)  asset group
#   - asset-manifest-toolkit (M4-P2) asset group
#   - unreal-bridge        (M5-P1)  engine group
#   - git-lfs-toolkit      (M5-P2)  engine group
#   - gauntlet-toolkit     (M6-P2)  qa group
#   - vision-qa-toolkit    (M6-P3)  qa group
#   - screenshot-baseline-toolkit (M6-P3) qa group
#   - engine-log-toolkit   (M6)     qa group

skills:
  - name: comfyui-toolkit
    description: "Generate and iterate 2D game assets via a local/remote ComfyUI server."
    keywords:
      - comfyui
      - asset generation
      - texture
      - concept art
      - icon
      - game art
    operations:
      - name: asset_manifest_validate
        description: Load a project's asset manifest YAML, validate against hub JSON Schema, and return a structured findings envelope.
      - name: comfyui_asset_status
        description: Look up completion state for a prompt_id from generate_asset (live or dry-run).
      - name: comfyui_generate_asset
        description: Submit an allow-listed workflow, poll history, and fetch PNG outputs under hub traces.
      - name: comfyui_health_check
        description: Probe ComfyUI HTTP reachability and queue hints (supports dry-run).
      - name: comfyui_list_workflows
        description: List bundled workflow JSON graphs and optional _cuebert_description metadata.
    skill_path: .cursor/skills/comfyui-toolkit/SKILL.md
    mcp_group: asset
    status: alpha

  - name: unreal-bridge
    description: Query and control a running Unreal Editor via Epic's Remote Control HTTP API. Use for inspecting presets, describing exposed properties/functions, and for scoped property sets and exposed function calls (live or dry-run).
    keywords:
      - unreal
      - unreal engine
      - ue5
      - remote control
      - preset
      - actor
    operations:
      - name: unreal_health_check
        description: Probe Unreal Remote Control HTTP reachability via GET /remote/info (supports dry-run and not_configured semantics).
      - name: unreal_list_presets
        description: List Remote Control presets from GET /remote/presets or dry-run fixtures.
      - name: unreal_describe_preset
        description: Describe a preset's exposed properties and callable functions (GET /remote/preset/<name>).
      - name: unreal_ping_actor
        description: Read-only check that an actor label is exposed under a preset (GET expose/actor path).
      - name: unreal_set_property
        description: Set a scalar property on a preset-exposed object (PUT /remote/object/property; scope whitelist; audit + memory hooks).
      - name: unreal_call_function
        description: Invoke an exposed UFunction on a preset-exposed object (PUT /remote/object/call; scope whitelist; audit + memory hooks).
    skill_path: .cursor/skills/unreal-bridge/SKILL.md
    mcp_group: engine
    status: alpha

  - name: memory-toolkit
    description: "Milestone and troubleshooting memory for cuebert (SQLite FTS5 + optional vector). Text-only by default (CUEBERT_MEMORY_MODE=text); hybrid mode opt-in."
    keywords: [memory, milestone, troubleshoot, lookup, commit, search, remember, history, decisions]
    operations:
      - name: milestone_lookup
        description: Look up milestone context by project/milestone identifiers.
      - name: milestone_commit
        description: Commit milestone results (deferred items, decisions, errors, files touched).
      - name: troubleshoot_search
        description: Search past troubleshooting sessions by query (FTS5/BM25 + optional vector).
      - name: troubleshoot_commit
        description: Commit a troubleshooting session (symptoms, root cause, resolution, tags).
    skill_path: .cursor/skills/memory-toolkit/SKILL.md
    status: active

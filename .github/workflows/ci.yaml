name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          if [ -f .cursor/mcp-server/requirements.txt ]; then
            pip install -r .cursor/mcp-server/requirements.txt || true
          fi

      - name: Python syntax check
        run: |
          find .cursor -name "*.py" -print0 | xargs -0 python -m py_compile
          echo "All Python files compile successfully"

      - name: YAML validation
        run: |
          python -c "
          import pathlib, yaml, sys
          errors = 0
          for f in pathlib.Path('.cuebert').rglob('*.yaml'):
              try:
                  yaml.safe_load(f.read_text())
              except Exception as e:
                  print(f'FAIL: {f}: {e}')
                  errors += 1
          for f in pathlib.Path('.cuebert').rglob('*.yaml.example'):
              try:
                  yaml.safe_load(f.read_text())
              except Exception as e:
                  print(f'FAIL: {f}: {e}')
                  errors += 1
          print(f'Checked YAML files, {errors} errors')
          sys.exit(1 if errors else 0)
          "

      - name: JSON validation
        run: |
          python -c "
          import pathlib, json, sys
          errors = 0
          for pattern in ['.cuebert/**/*.json', '.cursor/**/*.json', 'examples/**/*.json']:
              for f in pathlib.Path('.').glob(pattern):
                  try:
                      json.loads(f.read_text())
                  except Exception as e:
                      print(f'FAIL: {f}: {e}')
                      errors += 1
          # Also check .uproject files (JSON format)
          for f in pathlib.Path('.').rglob('*.uproject'):
              try:
                  json.loads(f.read_text())
              except Exception as e:
                  print(f'FAIL: {f}: {e}')
                  errors += 1
          print(f'Checked JSON files, {errors} errors')
          sys.exit(1 if errors else 0)
          "

      - name: Agent slims inventory
        run: |
          count=$(find .cursor/agents -name "*.md" | wc -l)
          echo "Found $count agent slims"
          [ "$count" -ge 10 ] || (echo "FAIL: expected >= 10 agent slims" && exit 1)

      - name: Skills registry check
        run: |
          python -c "
          import yaml, pathlib, sys
          reg = yaml.safe_load(pathlib.Path('.cuebert/registry/skills.yaml').read_text())
          skills = reg.get('skills', [])
          errors = 0
          for s in skills:
              p = pathlib.Path(s.get('skill_path', ''))
              if not p.exists():
                  print(f'WARN: skill_path not found: {p}')
                  errors += 1
          print(f'Checked {len(skills)} skills, {errors} missing paths')
          "

      - name: No hardcoded credentials
        run: |
          if grep -rIn 'AKIA\|sk_live_\|ghp_\|gho_\|ghu_' .cursor/skills/ --include='*.py'; then
            echo "FAIL: potential hardcoded credentials found"
            exit 1
          fi
          echo "No hardcoded credentials detected"
